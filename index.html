<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10091d"><title>格莉奇遊樂園・幸運轉盤</title><link rel="preload" href="./assets/avatar-atlas.webp" as="image" type="image/webp"><style>
:root{--ink:#fff;--muted:#d4cae8;--panel:rgba(23,13,40,.91);--mint:#69eee0;--gold:#ffd36e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10091d;color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer}#ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));pointer-events:none}#ui>*{pointer-events:auto}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand,.ghost,#status{border:1px solid rgba(105,238,224,.48);border-radius:10px;background:var(--panel);box-shadow:0 0 18px rgba(105,238,224,.13);backdrop-filter:blur(8px)}.brand{padding:7px 11px}.brand h1{font-size:18px;line-height:1.25;margin:0;letter-spacing:.07em}.brand small{display:block;color:var(--muted);font-size:13px}.tools{display:flex;align-items:flex-start;gap:8px}.ghost{min-height:44px;padding:8px 12px;color:#fff}.ghost[aria-pressed=true]{color:var(--mint);border-color:var(--mint)}#collectionButton{width:54px;border-color:#9e85c7}.bottom{align-items:flex-end}#status{min-height:44px;max-width:440px;padding:9px 13px}#status b{color:var(--gold)}#spin{min-height:52px;min-width:126px;border:1px solid #ffe09b;border-radius:12px;background:linear-gradient(135deg,#b77929,#f5bd4d);color:#24152f;font-weight:900;box-shadow:0 0 28px rgba(255,205,97,.42)}#spin:disabled{opacity:.6}.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(8,3,16,.73)}.modal[hidden]{display:none}.card{width:min(370px,92vw);border:1px solid rgba(105,238,224,.55);border-radius:20px;background:#211535;padding:19px;text-align:center;box-shado </style></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="brand"><button id="exit" class="ghost" hidden>← 離開</button><h1>幸運轉盤<small>格莉奇遊樂園</small></h1></div><div class="tools"><button id="sound" class="ghost" aria-pressed="false">聲音：開</button><button id="collectionButton" class="ghost" aria-label="查看轉盤收藏">收藏 <span id="count">0</span></button></div></div><div class="bottom"><div id="status">按下轉盤，看看今天會遇見誰。</div><button id="spin">轉動轉盤</button></div></div><div id="reveal" class="modal" hidden></div><div id="collection" class="modal" hidden></div><script type="module" src="./main.js"></script></body></html>
